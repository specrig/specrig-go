openapi: 3.0.3
info:
  title: Things
  version: "1"
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: things.example.test
paths:
  /things/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: the thing
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
