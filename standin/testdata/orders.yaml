openapi: 3.0.3
info:
  title: Orders
  version: "1"
paths:
  /orders:
    get:
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: the orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewOrder"
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "422":
          description: refused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /orders/latest:
    get:
      responses:
        "200":
          description: the newest order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: no such order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: gone
  /ping:
    get:
      responses:
        "204":
          description: alive
        "503":
          description: not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    Order:
      type: object
      required: [id, sku]
      properties:
        id:
          type: string
        sku:
          type: string
        qty:
          type: integer
    NewOrder:
      type: object
      required: [sku, qty]
      properties:
        sku:
          type: string
        qty:
          type: integer
          minimum: 1
    Problem:
      type: object
      required: [code]
      properties:
        code:
          type: string
        message:
          type: string
    Failure:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
