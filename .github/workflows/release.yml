name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: waffle/go.mod
      - run: make test
      - run: make release
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes "specrig-flows ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}
